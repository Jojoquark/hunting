name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/app-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy PWA
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Svelte PWA bauen
        env:
          # Optional: Repository-Variable HUNTING_WS_URL, z. B. wss://hunting-server.<subdomain>.workers.dev/ws
          VITE_WS_URL: ${{ vars.HUNTING_WS_URL }}
        run: pnpm --filter hunting-app build

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/dist'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
