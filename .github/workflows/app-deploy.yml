name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/app-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy PWA
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Svelte PWA bauen (fuer jojoquark.github.io/hunting)
        run: pnpm --filter app build
        env:
          BASE_URL: '/hunting/'

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/dist'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
