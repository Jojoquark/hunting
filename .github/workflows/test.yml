name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit & E2E Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: pnpm einrichten
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typ-Pruefung
        run: pnpm typecheck

      - name: Vitest Unit & Integrationstests ausfuehren
        run: pnpm test
